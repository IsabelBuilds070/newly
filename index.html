<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NewsHub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>📰 <span>News</span>Hub</h1>
    <div class="search-bar">
      <input id="searchInput" type="text" placeholder="Search any topic..." />
      <button id="searchBtn">Search</button>
    </div>
    <div class="categories">
  <button class="cat-btn active" data-cat="breaking-news">Breaking</button>
  <button class="cat-btn" data-cat="technology">Tech</button>
  <button class="cat-btn" data-cat="business">Business</button>
  <button class="cat-btn" data-cat="sports">Sports</button>
  <button class="cat-btn" data-cat="entertainment">Entertainment</button>
  <button class="cat-btn" data-cat="health">Health</button>
</div>
  </header>

  <main>
    <p id="status"></p>
    <div id="grid" class="grid"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
